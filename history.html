<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Cup Game</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#000;min-height:100vh;color:#fff;overflow-x:hidden;}

.bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%,rgba(255,140,0,.1) 0%,transparent 60%),#000;}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

.page{position:relative;z-index:10;min-height:100vh;padding-bottom:60px;}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06);}
.hdr-back{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.06);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:background .2s;}
.hdr-back:hover{background:rgba(255,255,255,.12);}
.hdr-title{font-size:17px;font-weight:700;color:#fff;flex:1;text-align:center;}
.hdr-spacer{width:38px;}

/* Summary */
.summary{margin:20px 20px 0;display:flex;gap:10px;animation:slide-up .5s ease both .1s;}
.sum-card{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;text-align:center;}
.sum-lbl{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;}
.sum-val{font-size:20px;font-weight:800;margin-top:4px;}
.sum-val.green{color:#4eff91;}
.sum-val.orange{color:#ff9500;}
.sum-val.white{color:#fff;}

/* History list */
.hist-section{padding:20px 20px 0;animation:slide-up .5s ease both .2s;}
.hist-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}

.hist-item{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;padding:16px;
  margin-bottom:12px;
  animation:slide-up .4s ease both;
  display:flex;align-items:center;gap:14px;
}
.hist-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.hist-icon.processing{background:rgba(255,149,0,.15);}
.hist-icon.success{background:rgba(0,200,80,.15);}

.hist-info{flex:1;min-width:0;}
.hist-amt{font-size:20px;font-weight:800;color:#4eff91;}
.hist-upi{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-time{font-size:10px;color:rgba(255,255,255,.28);margin-top:3px;}

.hist-badge{
  padding:4px 10px;border-radius:20px;
  font-size:10px;font-weight:700;flex-shrink:0;
}
.hist-badge.processing{background:rgba(255,149,0,.2);color:#ff9500;}
.hist-badge.success{background:rgba(0,200,80,.2);color:#4eff91;}

/* Empty state */
.empty{text-align:center;padding:60px 20px;animation:slide-up .5s ease both .2s;}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:.4;}
.empty-title{font-size:18px;font-weight:700;color:rgba(255,255,255,.4);margin-bottom:8px;}
.empty-sub{font-size:13px;color:rgba(255,255,255,.2);margin-bottom:28px;}
.empty-btn{
  display:inline-block;padding:14px 32px;border-radius:16px;
  background:linear-gradient(135deg,#ff9500,#ff5500);
  color:#fff;font-family:'Poppins',sans-serif;
  font-size:14px;font-weight:800;text-decoration:none;
}

@keyframes slide-up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="bgCanvas"></canvas>

<div class="page">

  <!-- Header -->
  <div class="hdr">
    <a class="hdr-back" href="withdraw.html">←</a>
    <div class="hdr-title">📋 Withdrawal History</div>
    <div class="hdr-spacer"></div>
  </div>

  <!-- Summary -->
  <div class="summary" id="summary" style="display:none;">
    <div class="sum-card">
      <div class="sum-lbl">Total Withdrawn</div>
      <div class="sum-val green" id="totalAmt">₹0</div>
    </div>
    <div class="sum-card">
      <div class="sum-lbl">Requests</div>
      <div class="sum-val white" id="totalCount">0</div>
    </div>
    <div class="sum-card">
      <div class="sum-lbl">Status</div>
      <div class="sum-val orange">⏳</div>
    </div>
  </div>

  <!-- History List -->
  <div class="hist-section" id="histSection">
    <!-- Filled by JS -->
  </div>

</div>

<script>
// Load history
const history = JSON.parse(localStorage.getItem('wdHistory') ?? '[]');
const section = document.getElementById('histSection');

if(history.length === 0){
  section.innerHTML = `
    <div class="empty">
      <div class="empty-icon">📭</div>
      <div class="empty-title">Koi history nahi</div>
      <div class="empty-sub">Abhi tak koi withdrawal request nahi ki</div>
      <a href="withdraw.html" class="empty-btn">💸 Withdraw Karo</a>
    </div>`;
} else {
  // Show summary
  document.getElementById('summary').style.display = 'flex';
  const total = history.reduce((s,h)=>s+h.amt,0);
  document.getElementById('totalAmt').textContent = '₹' + total;
  document.getElementById('totalCount').textContent = history.length;

  // Render items
  section.innerHTML = '<div class="hist-label">All Requests</div>' +
    history.map((h, i) => `
      <div class="hist-item" style="animation-delay:${i*0.07}s">
        <div class="hist-icon processing">⏳</div>
        <div class="hist-info">
          <div class="hist-amt">₹${h.amt}</div>
          <div class="hist-upi">📱 ${h.upi}</div>
          <div class="hist-time">🕐 ${h.time}</div>
        </div>
        <div class="hist-badge processing">Processing</div>
      </div>
    `).join('');
}

// BG Particles
(function(){
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  let W,H,particles=[];
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);
  const COLS=['rgba(255,160,40,','rgba(255,200,0,','rgba(0,200,80,'];
  for(let i=0;i<28;i++) particles.push({x:Math.random()*1000,y:Math.random()*2000,r:Math.random()*1.8+.4,sp:Math.random()*.3+.1,op:Math.random()*.35+.1,col:COLS[i%3],wave:Math.random()*Math.PI*2,waveAmp:Math.random()*14+5});
  function draw(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.y-=p.sp; p.wave+=.018;
      if(p.y<-10) p.y=H+10;
      ctx.beginPath(); ctx.arc((p.x+Math.sin(p.wave)*p.waveAmp)%W,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.col+p.op+')'; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
